<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResNet-18 通用物体识别</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, #1a1a2e 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      width: 100%;
      max-width: 540px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent-hover);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .header p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }
    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.05);
    }
    .drop-zone .icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .drop-zone p {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .drop-zone .filename {
      color: var(--text);
      font-weight: 600;
      margin-top: 0.5rem;
      word-break: break-all;
    }
    .drop-zone input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      cursor: pointer;
    }
    .preview {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      margin-top: 1rem;
      display: none;
    }
    .preview.show { display: block; }
    .btn {
      display: block;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-top: 1.25rem;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled {
      background: var(--border);
      cursor: not-allowed;
      opacity: 0.6;
    }
    .flash {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .footer a { color: var(--accent-hover); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <span class="badge">ResNet-18 · ImageNet 1000 类</span>
        <h1>通用物体识别</h1>
        <p>上传一张图片，AI 将识别其中的物体并返回 Top-3 可能类别</p>
      </div>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for msg in messages %}
            <div class="flash">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" enctype="multipart/form-data" id="upload-form">
        <div class="drop-zone" id="dropZone">
          <div class="icon">📁</div>
          <p>点击或拖拽图片到此处上传</p>
          <p style="font-size:0.75rem; margin-top:0.3rem;">支持 JPG / PNG / GIF / BMP / WEBP</p>
          <div class="filename" id="filename"></div>
          <input type="file" name="image" id="fileInput" accept="image/*" required />
        </div>

        <img class="preview" id="preview" alt="预览" />

        <button type="submit" class="btn" id="submitBtn" disabled>开始识别</button>
      </form>

      <div class="footer">
        基于 torchvision 官方预训练权重 · CPU 量化推理 · <a href="/health">健康检查</a>
      </div>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const filename = document.getElementById('filename');
    const preview = document.getElementById('preview');
    const submitBtn = document.getElementById('submitBtn');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        filename.textContent = file.name;
        submitBtn.disabled = false;
        const reader = new FileReader();
        reader.onload = (ev) => { preview.src = ev.target.result; preview.classList.add('show'); };
        reader.readAsDataURL(file);
      }
    });

    ['dragover', 'dragenter'].forEach(evt =>
      dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); })
    );
    ['dragleave', 'dragend'].forEach(evt =>
      dropZone.addEventListener(evt, () => dropZone.classList.remove('dragover'))
    );
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        fileInput.dispatchEvent(new Event('change'));
      }
    });
  </script>
</body>
</html>
